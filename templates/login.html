{% extends "base.html" %}

{% block head %}
<style>
    .tab-active {
        border-bottom-color: #4f46e5;
        color: #4f46e5;
    }
    .tab-inactive {
        border-bottom-color: transparent;
        color: #64748b;
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-12rem)] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="mx-auto w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
            <i data-lucide="shield-check" class="w-7 h-7"></i>
        </div>
        <h2 class="mt-4 text-center text-2xl font-extrabold text-slate-900 tracking-tight">
            SmartAid Unified Portal
        </h2>
        <p class="mt-1 text-center text-sm text-slate-500">
            Staff access & public beneficiary tracking
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-xl shadow-slate-200/50 sm:rounded-2xl sm:px-10 border border-slate-200/80">
            
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tab-btn-staff" onclick="switchTab('staff')" class="w-1/2 pb-3 font-semibold text-sm border-b-2 tab-active transition-all flex items-center justify-center gap-2">
                    <i data-lucide="lock" class="w-4 h-4"></i> Staff Portal
                </button>
                <button id="tab-btn-beneficiary" onclick="switchTab('beneficiary')" class="w-1/2 pb-3 font-semibold text-sm border-b-2 tab-inactive hover:text-slate-800 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-4 h-4"></i> Beneficiary Status
                </button>
            </div>

            <!-- TAB 1: STAFF PORTAL -->
            <div id="tab-panel-staff" class="space-y-5">
                <div id="staff-error" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                    <span id="staff-error-msg">Invalid credentials.</span>
                </div>

                <form id="staff-login-form" onsubmit="handleStaffLogin(event)" class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Username</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="user" class="w-4 h-4"></i>
                            </div>
                            <input type="text" id="username" required
                                class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm placeholder-slate-400"
                                placeholder="e.g. admin or agent1">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="key" class="w-4 h-4"></i>
                            </div>
                            <input type="password" id="password" required
                                class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm placeholder-slate-400"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" id="staff-submit-btn"
                        class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
                        <span>Sign In to Workstation</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <!-- Quick Seed Credentials Helper -->
                <div class="pt-4 border-t border-slate-100">
                    <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 text-center">Demo Quick-Fill Credentials</p>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="fillLogin('admin', 'admin123')" class="p-2 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 font-medium text-slate-700 transition-colors text-center border border-slate-200">
                            <div class="font-bold">Admin</div>
                            <div class="text-[10px] text-slate-400">Maria Santos</div>
                        </button>
                        <button onclick="fillLogin('worker1', 'worker123')" class="p-2 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 font-medium text-slate-700 transition-colors text-center border border-slate-200">
                            <div class="font-bold">Social Worker</div>
                            <div class="text-[10px] text-slate-400">Juan Dela Cruz</div>
                        </button>
                        <button onclick="fillLogin('agent1', 'agent123')" class="p-2 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 font-medium text-slate-700 transition-colors text-center border border-slate-200">
                            <div class="font-bold">Field Agent</div>
                            <div class="text-[10px] text-slate-400">Ana Reyes</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- TAB 2: BENEFICIARY QUICK TRACKER -->
            <div id="tab-panel-beneficiary" class="hidden space-y-5">
                <form id="track-form" onsubmit="handleBeneficiaryLookup(event)" class="space-y-4">
                    <div>
                        <label for="track-ref" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Application Reference Number</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="ticket" class="w-4 h-4"></i>
                            </div>
                            <input type="text" id="track-ref" required
                                class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm placeholder-slate-400 uppercase font-mono"
                                placeholder="e.g. APP-2026-00101">
                        </div>
                    </div>

                    <div>
                        <label for="track-phone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Registered Contact Number (Optional)</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </div>
                            <input type="tel" id="track-phone"
                                class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-sm placeholder-slate-400"
                                placeholder="0917XXXXXXX">
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-700 transition-all">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>Check Status & Voucher</span>
                    </button>
                </form>

                <div class="pt-4 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-500">
                        Haven't registered your household yet?
                    </p>
                    <a href="/apply" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-700">
                        <span>Fill Out Public Intake Form</span>
                        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function switchTab(tab) {
        const staffBtn = document.getElementById('tab-btn-staff');
        const beneficiaryBtn = document.getElementById('tab-btn-beneficiary');
        const staffPanel = document.getElementById('tab-panel-staff');
        const beneficiaryPanel = document.getElementById('tab-panel-beneficiary');

        if (tab === 'staff') {
            staffBtn.className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 tab-active transition-all flex items-center justify-center gap-2';
            beneficiaryBtn.className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 tab-inactive hover:text-slate-800 transition-all flex items-center justify-center gap-2';
            staffPanel.classList.remove('hidden');
            beneficiaryPanel.classList.add('hidden');
        } else {
            beneficiaryBtn.className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 tab-active transition-all flex items-center justify-center gap-2';
            staffBtn.className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 tab-inactive hover:text-slate-800 transition-all flex items-center justify-center gap-2';
            beneficiaryPanel.classList.remove('hidden');
            staffPanel.classList.add('hidden');
        }
        lucide.createIcons();
    }

    function fillLogin(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }

    async function handleStaffLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errBox = document.getElementById('staff-error');
        const errMsg = document.getElementById('staff-error-msg');
        const btn = document.getElementById('staff-submit-btn');

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin mr-2">⏳</span> Verifying...`;
        errBox.classList.add('hidden');

        try {
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const res = await fetch('/api/v1/auth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.detail || 'Authentication failed');
            }

            // Route based on user role
            if (data.role === 'field_agent') {
                window.location.href = '/scanner';
            } else {
                window.location.href = '/admin';
            }
        } catch (err) {
            errMsg.textContent = err.message;
            errBox.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = `<span>Sign In to Workstation</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            lucide.createIcons();
        }
    }

    function handleBeneficiaryLookup(e) {
        e.preventDefault();
        const ref = document.getElementById('track-ref').value.trim();
        if (ref) {
            window.location.href = `/track?ref=${encodeURIComponent(ref)}`;
        }
    }
</script>
{% endblock %}
